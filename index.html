<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      const requestedLanguage = new URLSearchParams(location.search).get('lang');
      let language = requestedLanguage;
      try {
        if (language === 'pt' || language === 'en') localStorage.setItem('sab-language', language);
        else language = localStorage.getItem('sab-language');
      } catch {}
      document.documentElement.lang = language === 'en' ? 'en' : 'pt-BR';
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ce3f40" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('mts-portfolio-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'dark' ? '#181c21' : '#ce3f40';
    </script>
    <script>
      document.documentElement.dataset.portfolio = !location.hash || location.hash === '#conteudo' || location.hash.startsWith('#edicao') ? 'editor' : 'developer';
      if (document.documentElement.dataset.portfolio === 'editor') document.querySelector('meta[name="theme-color"]').content = '#101114';
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Sab: edição de gameplays, vídeos longos, highlights e vídeos verticais. Conheça meu trabalho e vamos conversar sobre seu próximo vídeo." />
    <title>Sab | Edição de vídeo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
