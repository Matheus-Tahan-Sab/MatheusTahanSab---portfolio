<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ce3f40" />
    <script>
      document.documentElement.dataset.portfolio = location.hash.startsWith('#edicao') ? 'editing' : 'development';
      const editingPage = document.documentElement.dataset.portfolio === 'editing';
      try {
        const savedTheme = localStorage.getItem(editingPage ? 'sab-editor-theme' : 'mts-portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (editingPage ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = editingPage ? 'dark' : 'light';
      }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.portfolio === 'editing'
        ? (document.documentElement.dataset.theme === 'dark' ? '#100e19' : '#f2eee7')
        : (document.documentElement.dataset.theme === 'dark' ? '#181c21' : '#ce3f40');
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Portfólio de desenvolvimento de Matheus Tahan Sab." />
    <title>Matheus Tahan Sab | Portfólio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
